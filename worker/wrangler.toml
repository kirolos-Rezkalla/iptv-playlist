name = "iptv-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Required secret (not a var): signs the /e/ stream-relay URLs the worker emits so
# the relay only serves hosts that appeared in a generated playlist.
#   npx wrangler secret put PROXY_SECRET      # any long random string
# For `wrangler dev`, put PROXY_SECRET=... in worker/.dev.vars (gitignored).

[vars]
# Optional. If set, the old /playlist.m3u and /playlist-hls.m3u routes redirect to
# generated links for PLAYLIST_BASE + that filename.
PLAYLIST_BASE = "https://raw.githubusercontent.com/kirolos-Rezkalla/iptv-playlist/main"
